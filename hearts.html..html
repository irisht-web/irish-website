
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    135deg, #ffd6e7, #ff9ecb, #ffe0ed
  );
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  z-index: 2;
}

h1 {
  color: #ff287c;
  font-size: 40px;
  text-shadow: 2px 2px white;
}

p {
  color: #a83260;
  font-size: 18px;
  margin-top: 15px;
}

.heart {
  position: absolute;
  bottom: -50px;
  color: #ff287c;
  font-size: 25px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh)
      rotate(360deg);
    opacity: 0;
  }
}

button {
  margin-top: 25px;
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: #ff287c;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #e60062;
}
</style>
</head>

<body>

<div class="container">
  <h1> I LOVE YOU! 💗 </h1>
  <p>You make my world more beautiful 🌷</p>
  <button onclick="showLove()">
    Click me 💌
  </button>
</div>

<script>
function showLove() {
  alert("You are special to me! 💗🥹");
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "♥";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize =
    (15 + Math.random() * 35) + "px";
  heart.style.animationDuration =
    (3 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 8000);
}

setInterval(createHeart, 250);
</script>

</body>
</html>
