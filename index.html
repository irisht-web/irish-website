<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irish's World</title>

  <style>
    body {
      background-color: lavender;
      color: purple;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      background-color: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 20px;
      max-width: 400px;
    }

    h1, h2 {
      color: plum;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Hi, I'm Irish! 💜</h1>
    <p>Welcome to my little world 🌷</p>
  </div>

  <div class="box">
    <h2>About Me 🎀</h2>
    <p>Name: Irish</p>
    <p>Age: 15</p>
    <p>Favorite color: Pastel purple</p>
    <p>Hobby: Listening to music</p>
  </div>

  <div class="box">
    <h2>A Little Note 💌</h2>
    <p>
      Just a girl enjoying life,
      making memories, and
      being herself. ♡
    </p>
  </div>

  <p>Made with love by Irish ♡</p>

</body>
</html>
